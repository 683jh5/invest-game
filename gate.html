<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>과거의 문 · 상단 입장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--navy:#043B72;--orange:#F58220;--orange2:#CB6015;--sand:#F0B26B;--ink:#1C2430;--gray:#48535B;--paper:#FBF6EC;--line:#E3D5BC}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{word-break:keep-all;font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',sans-serif;background:#1B1612;color:var(--paper);overflow:hidden;-webkit-user-select:none;user-select:none}
button,input{font:inherit}
button{cursor:pointer;border:none}
.bg{position:fixed;inset:0;background:linear-gradient(180deg,rgba(4,20,45,.35),rgba(4,20,45,.9)),url(img/bottari/door.jpg) center/cover;z-index:-1}
/* 입장 화면 */
.gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center}
.gate .kick{font-size:clamp(18px,2.2vw,26px);font-weight:700;color:var(--sand);letter-spacing:2px}
.gate h1{font-size:clamp(44px,7vw,96px);font-weight:900;letter-spacing:-2px;line-height:1.1}
.gate p{font-size:clamp(18px,2.2vw,26px);color:#E9DECB}
.form{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:min(720px,100%)}
.form input{flex:1;min-width:220px;padding:22px 24px;border-radius:18px;border:3px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;font-size:clamp(24px,3vw,34px);font-weight:800;text-align:center;-webkit-user-select:text;user-select:text}
.form input:focus{outline:none;border-color:var(--sand)}
.form input::placeholder{color:rgba(255,255,255,.45)}
.big{padding:22px 40px;border-radius:18px;background:var(--orange);color:var(--ink);font-weight:900;font-size:clamp(24px,3vw,34px);box-shadow:0 7px 0 var(--orange2)}
.big:active{transform:translateY(4px);box-shadow:0 3px 0 var(--orange2)}
.msg{min-height:1.6em;font-size:20px;font-weight:700;color:#FFD3A8}
.left{font-size:17px;color:#CFC3AE}
/* 룰렛 · 결과 */
.draw{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;background:rgba(10,12,18,.72);text-align:center}
.who{font-size:clamp(26px,3.4vw,44px);font-weight:800}
.wheel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:min(900px,100%)}
.wc{border-radius:22px;padding:26px 12px;background:rgba(255,255,255,.1);border:4px solid transparent;font-size:clamp(24px,3vw,40px);font-weight:900;color:rgba(255,255,255,.55);transition:transform .08s}
.wc.hot{background:var(--c);color:#fff;border-color:#fff;transform:scale(1.06)}
.res{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:var(--c);text-align:center;animation:pop .5s ease}
.res .nm{font-size:clamp(30px,4vw,54px);font-weight:800;color:rgba(255,255,255,.92)}
.res .sd{font-size:clamp(70px,12vw,170px);font-weight:900;letter-spacing:-3px;line-height:1;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.18)}
.res .go{font-size:clamp(28px,4vw,52px);font-weight:900;color:#fff;background:rgba(0,0,0,.18);border-radius:999px;padding:12px 34px}
.res .goods{font-size:clamp(18px,2.2vw,26px);color:rgba(255,255,255,.9);font-weight:600}
.res .big{margin-top:12px;background:#fff;box-shadow:0 7px 0 rgba(0,0,0,.2)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
/* 강사 버튼 · 명단 */
.gear{position:fixed;right:14px;top:14px;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);font-size:22px}
.panel{position:fixed;inset:0;background:#15110E;overflow:auto;padding:22px 26px 40px}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.ph h2{font-size:28px;font-weight:900;margin-right:auto}
.ph h2 small{font-size:17px;color:#CFC3AE;font-weight:600;margin-left:8px}
.tb{padding:11px 16px;border-radius:11px;background:rgba(255,255,255,.1);color:var(--paper);font-weight:700;font-size:16px}
.tb.o{background:var(--orange);color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.col{background:var(--paper);color:var(--ink);border-radius:18px;overflow:hidden;border-top:12px solid var(--c)}
.col.off{opacity:.45}
.col h3{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px;font-size:23px;font-weight:900}
.col h3 span{font-size:16px;color:var(--gray);font-weight:700}
.col .tc{padding:0 16px 8px;font-size:15px;color:var(--gray);font-weight:600}
.col ul{list-style:none;padding:0 10px 12px}
.col li{display:flex;align-items:center;gap:6px;padding:8px 6px;border-top:1px solid var(--line);font-size:19px;font-weight:700}
.col li b{flex:1}
.col li select{font:inherit;font-size:14px;padding:4px;border-radius:8px;border:1px solid var(--line);background:#fff}
.col li button{background:none;color:var(--gray);font-size:20px;padding:0 6px}
.col .add{display:flex;gap:6px;padding:0 12px 14px}
.col .add input{flex:1;min-width:0;padding:8px 10px;border-radius:9px;border:1.5px solid var(--line);font-size:16px;-webkit-user-select:text;user-select:text}
.col .add button{padding:8px 12px;border-radius:9px;background:var(--ink);color:#fff;font-weight:700}
.col .hs{padding:0 16px 8px;font-size:16px;font-weight:700;color:var(--ink)}
.col .hs i{color:#A99C88;font-style:normal;font-weight:600}
.col .hs button{background:none;color:var(--gray);font-size:18px}
.col .tog{display:flex;align-items:center;gap:6px;padding:0 16px 10px;font-size:14px;color:var(--gray);font-weight:600}
.set{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:18px 0 8px;font-size:17px;color:#E9DECB}
.set .cnt{display:inline-flex;align-items:center;gap:8px}
.set .cnt button{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:22px;font-weight:800}
.set .cnt b{min-width:34px;text-align:center;font-size:22px}
.note{font-size:15px;color:#A99C88;line-height:1.6;margin-top:14px}
.sh{font-size:22px;font-weight:900;margin:26px 0 10px}
.roster{display:grid;grid-template-columns:minmax(260px,1fr) minmax(260px,1.4fr);gap:14px}
@media(max-width:700px){.roster{grid-template-columns:1fr}}
.roster textarea{width:100%;min-height:170px;padding:12px 14px;border-radius:10px;border:2px solid rgba(255,255,255,.18);background:rgba(0,0,0,.3);color:#fff;font:inherit;font-size:17px;font-weight:600;line-height:1.5;resize:vertical;-webkit-user-select:text;user-select:text}
.roster .st{background:rgba(255,255,255,.06);border-radius:12px;padding:14px 16px;font-size:16px;color:#E9DECB;line-height:1.7}
.roster .st b{color:var(--sand)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips span{background:rgba(255,255,255,.12);border-radius:999px;padding:3px 11px;font-size:15px;font-weight:700}
.txt{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.txt label{display:flex;flex-direction:column;gap:6px;font-size:15px;color:#CFC3AE;font-weight:700}
.txt input{padding:12px 14px;border-radius:10px;border:2px solid rgba(255,255,255,.18);background:rgba(0,0,0,.3);color:#fff;font-size:18px;font-weight:700;-webkit-user-select:text;user-select:text}
.txt input:focus{outline:none;border-color:var(--sand)}
.pin{position:fixed;inset:0;background:rgba(10,10,14,.85);display:grid;place-items:center;padding:20px}
.pbox{background:#221B15;border-radius:22px;padding:26px 24px;width:min(360px,100%);text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.pbox h3{font-size:24px;font-weight:900}
.pbox p{font-size:15px;color:#CFC3AE;min-height:1.4em}
.dots{display:flex;gap:12px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--sand)}
.dots i.f{background:var(--sand)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.pad button{height:64px;border-radius:14px;background:rgba(255,255,255,.1);color:#fff;font-size:26px;font-weight:800}
.confirm{display:inline-flex;gap:8px;align-items:center;background:#3A1E12;border-radius:11px;padding:6px 10px;font-size:15px}
</style>
</head>
<body>
<div class="bg"></div>

<section class="gate" id="gate">
  <div class="kick" id="tKick"></div>
  <h1 id="tHead"></h1>
  <p id="tSub"></p>
  <form class="form" id="form" autocomplete="off">
    <input id="nm" maxlength="12" placeholder="이름 또는 별명" aria-label="이름 또는 별명">
    <button class="big" type="submit">문 열기</button>
  </form>
  <div class="msg" id="msg" role="status"></div>
  <div class="left" id="left"></div>
</section>

<section class="draw" id="draw" hidden>
  <div class="who" id="who"></div>
  <div class="wheel" id="wheel"></div>
</section>

<section class="res" id="res" hidden>
  <div class="nm" id="rNm"></div>
  <div class="sd" id="rSd"></div>
  <div class="go" id="rGo"></div>
  <div class="goods" id="rGoods"></div>
  <button class="big" id="next">다음 친구</button>
</section>

<button class="gear" id="gear" aria-label="강사 명단 열기">⚙</button>

<section class="pin" id="pin" hidden>
  <div class="pbox">
    <h3 id="pinT">비밀번호</h3>
    <p id="pinS"></p>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad"></div>
    <button class="tb" id="pinX">취소</button>
  </div>
</section>

<section class="panel" id="panel" hidden>
  <div class="ph">
    <h2>상단 명단 <small id="total"></small></h2>
    <button class="tb" id="fs">전체 화면</button>
    <span id="rsBox"><button class="tb" id="reset">처음부터</button></span>
    <button class="tb o" id="close">입장 화면으로</button>
  </div>
  <div class="cols" id="cols"></div>
  <div class="set">
    <span>상단별 정원</span>
    <span class="cnt"><button id="capM" aria-label="정원 줄이기">−</button><b id="cap"></b><button id="capP" aria-label="정원 늘리기">+</button></span>
    <span>· 정원이 다 차면 인원이 가장 적은 상단부터 한 명씩 더 들어가요</span>
  </div>
  <h2 class="sh">참가자 명단</h2>
  <div class="roster">
    <label class="txt" style="display:block"><textarea id="iRoster" placeholder="한 줄에 한 명씩, 또는 쉼표로 구분해서 이름을 넣어 주세요&#10;비워 두면 누구나 이름을 써서 입장할 수 있어요"></textarea></label>
    <div class="st" id="rStat"></div>
  </div>
  <h2 class="sh">행수 명단 <small style="font-size:15px;color:#CFC3AE;font-weight:600">멘토·강사·운영진 · 상단마다 한 명씩 배정</small></h2>
  <div class="roster">
    <label class="txt" style="display:block"><textarea id="iAdults" style="min-height:110px" placeholder="예: 여경쌤, 민수 멘토&#10;이 이름으로 입장하면 학생 대신 '행수'로 뽑혀요"></textarea></label>
    <div class="st" id="aStat"></div>
  </div>
  <h2 class="sh">입장 화면 글자</h2>
  <div class="txt">
    <label>맨 위 작은 글씨<input id="iKick" maxlength="40"></label>
    <label>큰 제목<input id="iHead" maxlength="30"></label>
    <label>안내 문구<input id="iSub" maxlength="60"></label>
  </div>
  <div class="set"><button class="tb" id="tDef">기본 글자로 되돌리기</button><button class="tb" id="pinC">비밀번호 바꾸기</button></div>
  <p class="note">배정 방식: 그 순간 인원이 가장 적은 상단들 중에서 무작위로 정해요. 그래서 먼저 온 친구도 상단을 고를 수 없고, 늦게 온 친구는 빈자리로 들어가요.<br>이름은 이 태블릿 브라우저에만 저장되고 다른 곳으로 보내지 않아요. 캠프가 끝나면 '처음부터'로 지워 주세요.</p>
</section>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SD=[
  {id:'silk', n:'비단 상단', c:'#8E44AD', t:'보라', g:'비단 · 명주실'},
  {id:'grain',n:'곡물 상단', c:'#D4A017', t:'노랑', g:'쌀 · 보리'},
  {id:'pot',  n:'도자기 상단',c:'#2E86C1', t:'파랑', g:'그릇 · 항아리'},
  {id:'herb', n:'약초 상단', c:'#2E8B57', t:'초록', g:'약초 · 탕약'},
  {id:'paper',n:'종이 상단', c:'#E67E22', t:'주황', g:'한지 · 지우산'},
  {id:'salt', n:'소금 상단', c:'#C0392B', t:'빨강', g:'소금 · 젓갈'}
];
const KEY='gate-sangdan-v1';
let S;try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
if(!S||!S.m)S={cap:3,m:{},off:{}};
if(!S.h)S.h={};
const DEF={kick:'청소년 AI금융캠프',head:'과거의 문이 열린다',sub:'이름을 쓰고 문을 열면, 오늘 내가 속할 상단이 정해져요'};
const CKEY='gate-sangdan-conf-v1';
let C;try{C=JSON.parse(localStorage.getItem(CKEY)||'null')}catch(e){C=null}
if(!C)C={txt:Object.assign({},DEF),pin:''};
const saveC=()=>{try{localStorage.setItem(CKEY,JSON.stringify(C))}catch(e){}};
function renderTxt(){
  $('#tKick').textContent=C.txt.kick;$('#tHead').textContent=C.txt.head;$('#tSub').textContent=C.txt.sub;
  document.title=(C.txt.head||'상단 입장')+(C.txt.kick?' · '+C.txt.kick:'');
}
SD.forEach(s=>{if(!S.m[s.id])S.m[s.id]=[]});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const on=()=>SD.filter(s=>!S.off[s.id]);
const all=()=>SD.flatMap(s=>S.m[s.id]);
const norm=v=>String(v||'').trim().replace(/\s+/g,' ');
const list=t=>[...new Set(String(t||'').split(/[\n,]/).map(norm).filter(Boolean))];
const roster=()=>list(S.roster);
const adults=()=>list(S.adults);
const hsOf=n=>SD.find(x=>S.h[x.id]===n);
function pickH(){const c=on().filter(s=>!S.h[s.id]);return c.length?c[Math.floor(Math.random()*c.length)]:null}
const sd=id=>SD.find(s=>s.id===id);

function pick(){
  const L=on();if(!L.length)return null;
  const min=Math.min(...L.map(s=>S.m[s.id].length));
  const c=L.filter(s=>S.m[s.id].length===min);
  return c[Math.floor(Math.random()*c.length)];
}
function leftTxt(){
  const n=all().length,capT=on().length*S.cap,r=Math.max(0,capT-n);
  $('#left').textContent=n?`지금까지 ${n}명 입장 · 남은 자리 ${r}`:'';
}
$('#form').addEventListener('submit',e=>{
  e.preventDefault();
  const v=$('#nm').value.trim().replace(/\s+/g,' ');
  if(!v){$('#msg').textContent='이름이나 별명을 먼저 써 주세요';return}
  const R=roster();
  const dh=hsOf(v);if(dh){$('#msg').textContent='';$('#nm').blur();show(v,dh,true,true);return}
  const done=SD.find(x=>S.m[x.id].includes(v));
  if(done){$('#msg').textContent='';$('#nm').blur();show(v,done,true);return}
  if(adults().includes(v)){
    const t=pickH();if(!t){$('#msg').textContent='모든 상단에 이미 행수가 있어요';return}
    $('#msg').textContent='';$('#nm').blur();S.h[t.id]=v;save();roll(v,t,true);return}
  if(R.length&&!R.includes(v)){$('#msg').textContent='명단에 없는 이름이에요. 띄어쓰기까지 확인해서 다시 써 주세요';return}
  const t=pick();if(!t){$('#msg').textContent='열린 상단이 없어요. 선생님을 불러 주세요';return}
  $('#msg').textContent='';$('#nm').blur();
  S.m[t.id].push(v);save();
  roll(v,t);
});
function roll(name,t,hs){
  const L=hs?on().filter(s=>!S.h[s.id]||s.id===t.id):on();
  $('#who').textContent=hs?`${name}님이 이끌 상단은…`:`${name}의 상단은…`;
  $('#wheel').innerHTML=L.map(s=>`<div class="wc" style="--c:${s.c}" data-id="${s.id}">${esc(s.n)}</div>`).join('');
  $('#gate').hidden=true;$('#draw').hidden=false;
  const cards=[...$('#wheel').children],end=L.indexOf(t);
  let i=Math.floor(Math.random()*L.length),steps=L.length*3+((end-i+L.length)%L.length),k=0;
  (function tick(){
    cards.forEach(c=>c.classList.remove('hot'));cards[i].classList.add('hot');
    if(k>=steps){setTimeout(()=>show(name,t,false,hs),550);return}
    k++;i=(i+1)%L.length;
    setTimeout(tick,60+Math.pow(k/steps,3)*360);
  })();
}
let timer=null;
function show(name,t,again,hs){
  $('#draw').hidden=true;
  const r=$('#res');r.style.setProperty('--c',t.c);
  $('#rNm').textContent=again?`${name}님은 이미 뽑았어요!`:`${name}님은`;
  $('#rSd').textContent=hs?t.n+' 행수':t.n;
  $('#next').textContent=hs?'다음 행수':'다음 친구';
  $('#rGo').textContent=hs?`상인들이 기다리는 ${t.t} 테이블로!`:`${t.t} 테이블로 가세요!`;
  $('#rGoods').textContent=`우리 상단의 물건 · ${t.g}`;
  r.hidden=false;clearTimeout(timer);timer=setTimeout(back,12000);
}
function back(){
  clearTimeout(timer);$('#res').hidden=true;$('#draw').hidden=true;$('#gate').hidden=false;
  $('#nm').value='';leftTxt();
}
$('#next').onclick=back;

/* 강사 명단 */
function renderCols(){if(document.getElementById('rStat')){rStat();aStat()}
  $('#cap').textContent=S.cap;
  $('#total').textContent=`${all().length}명`;
  $('#cols').innerHTML=SD.map(s=>{
    const L=S.m[s.id];
    return `<div class="col${S.off[s.id]?' off':''}" style="--c:${s.c}">
      <h3>${esc(s.n)}<span>${L.length}명</span></h3>
      <div class="tc">${s.t} 테이블 · ${esc(s.g)}</div>
      <div class="hs">행수 · ${S.h[s.id]?`<b>${esc(S.h[s.id])}</b> <button data-hdel="${s.id}" aria-label="행수 지우기">×</button>`:'<i>아직 없음</i>'}</div>
      <label class="tog"><input type="checkbox" data-tog="${s.id}"${S.off[s.id]?'':' checked'}> 이번 캠프에 사용</label>
      <ul>${L.map((n,i)=>`<li><b>${esc(n)}</b><select data-mv="${s.id}" data-i="${i}" aria-label="${esc(n)} 상단 옮기기"><option value="">옮기기</option>${SD.filter(x=>x.id!==s.id).map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join('')}</select><button data-del="${s.id}" data-i="${i}" aria-label="${esc(n)} 지우기">×</button></li>`).join('')}</ul>
      <div class="add"><input data-addin="${s.id}" maxlength="12" placeholder="이름 직접 추가"><button data-add="${s.id}">추가</button></div>
    </div>`}).join('');
}
$('#cols').addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.tog){S.off[t.dataset.tog]=!t.checked;save();renderCols();return}
  if(t.dataset.mv&&t.value){const from=t.dataset.mv,i=+t.dataset.i,[n]=S.m[from].splice(i,1);S.m[t.value].push(n);save();renderCols()}
});
$('#cols').addEventListener('click',e=>{
  const hd=e.target.closest('[data-hdel]');if(hd){delete S.h[hd.dataset.hdel];save();renderCols();return}
  const d=e.target.closest('[data-del]');
  if(d){S.m[d.dataset.del].splice(+d.dataset.i,1);save();renderCols();return}
  const a=e.target.closest('[data-add]');
  if(a){const inp=$(`[data-addin="${a.dataset.add}"]`),v=inp.value.trim();if(v&&!all().includes(v)){S.m[a.dataset.add].push(v);save();renderCols()}}
});
$('#iRoster').addEventListener('input',e=>{S.roster=e.target.value;save();rStat()});
$('#iAdults').addEventListener('input',e=>{S.adults=e.target.value;save();aStat()});
$('#capM').onclick=()=>{S.cap=Math.max(1,S.cap-1);save();renderCols()};
$('#capP').onclick=()=>{S.cap=Math.min(8,S.cap+1);save();renderCols()};
function rStat(){
  const R=roster(),A=all(),wait=R.filter(n=>!A.includes(n)),extra=R.length?A.filter(n=>!R.includes(n)):[];
  $('#rStat').innerHTML=R.length?`명단 <b>${R.length}명</b> · 입장 <b>${A.length-extra.length}명</b> · 아직 안 온 친구 <b>${wait.length}명</b>`+(wait.length?`<div class="chips">${wait.map(n=>`<span>${esc(n)}</span>`).join('')}</div>`:'')+(extra.length?`<div style="margin-top:8px">명단 밖 입장: ${extra.map(esc).join(', ')}</div>`:''):'명단이 비어 있어서 누구나 입장할 수 있어요. 이름을 넣으면 명단에 있는 이름만 문을 열 수 있어요.';
}
function aStat(){const A=adults(),got=A.filter(n=>hsOf(n));$('#aStat').innerHTML=A.length?`행수 후보 <b>${A.length}명</b> · 배정 <b>${got.length}명</b>`+(A.length>on().length?`<div style="margin-top:6px;color:#FFD3A8">사용하는 상단(${on().length}개)보다 많아요. 남는 분은 뽑을 수 없어요.</div>`:''):'비어 있으면 행수 뽑기를 쓰지 않아요.'}
function openPanel(){renderCols();$('#iRoster').value=S.roster||'';$('#iAdults').value=S.adults||'';aStat();rStat();$('#iKick').value=C.txt.kick;$('#iHead').value=C.txt.head;$('#iSub').value=C.txt.sub;$('#panel').hidden=false}
async function h(v){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('gate:'+v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'p:'+v}}
let P={mode:'',v:'',first:''};
function pinOpen(mode){P={mode,v:'',first:''};pinView();$('#pin').hidden=false}
function pinView(){
  const t={enter:['비밀번호','강사 설정을 열려면 4자리 숫자를 눌러 주세요'],new1:['비밀번호 만들기','처음이에요. 강사 설정용 4자리 숫자를 정해 주세요'],new2:['한 번 더','같은 숫자를 한 번 더 눌러 주세요']}[P.mode];
  $('#pinT').textContent=t[0];if(!P.err)$('#pinS').textContent=t[1];
  $('#dots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<P.v.length?'f':''}"></i>`).join('');
}
$('#pad').innerHTML=['1','2','3','4','5','6','7','8','9','','0','←'].map(k=>k?`<button data-k="${k}" aria-label="${k==='←'?'지우기':k}">${k}</button>`:'<span></span>').join('');
$('#pad').addEventListener('click',async e=>{
  const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;P.err=false;
  if(k==='←'){P.v=P.v.slice(0,-1);pinView();return}
  if(P.v.length>=4)return;P.v+=k;pinView();if(P.v.length<4)return;
  await new Promise(r=>setTimeout(r,150));
  if(P.mode==='enter'){
    if(await h(P.v)===C.pin){$('#pin').hidden=true;openPanel()}
    else{P.v='';P.err=true;$('#pinS').textContent='비밀번호가 달라요. 다시 눌러 주세요';pinView()}
  }else if(P.mode==='new1'){P.first=P.v;P.v='';P.mode='new2';pinView()}
  else if(P.mode==='new2'){
    if(P.v===P.first){C.pin=await h(P.v);saveC();$('#pin').hidden=true;openPanel()}
    else{P.v='';P.first='';P.mode='new1';P.err=true;$('#pinS').textContent='두 번 누른 숫자가 달라요. 처음부터 다시 정해 주세요';pinView()}
  }
});
$('#pinX').onclick=()=>{$('#pin').hidden=true};
$('#gear').onclick=()=>pinOpen(C.pin?'enter':'new1');
$('#pinC').onclick=()=>{$('#panel').hidden=true;pinOpen('new1')};
['Kick','Head','Sub'].forEach(n=>$('#i'+n).addEventListener('input',e=>{C.txt[n.toLowerCase()]=e.target.value;saveC();renderTxt()}));
$('#tDef').onclick=()=>{C.txt=Object.assign({},DEF);saveC();renderTxt();openPanel()};
$('#close').onclick=()=>{$('#panel').hidden=true;back()};
function resetBtn(){$('#rsBox').innerHTML='<button class="tb" id="reset">처음부터</button>';bindReset()}
function bindReset(){$('#reset').onclick=()=>{
  $('#rsBox').innerHTML='<span class="confirm">명단을 모두 지울까요? <button class="tb o" id="rsY">지우기</button><button class="tb" id="rsN">취소</button></span>';
  $('#rsY').onclick=()=>{S={cap:S.cap,m:{},off:S.off,roster:S.roster,adults:S.adults,h:{}};SD.forEach(s=>S.m[s.id]=[]);save();resetBtn();renderCols()};
  $('#rsN').onclick=resetBtn;
}}
$('#fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
bindReset();
renderTxt();
leftTxt();
})();
</script>
</body>
</html>
