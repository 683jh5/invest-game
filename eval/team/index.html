<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미래에셋 바이브코딩 캠프 평가 시스템</title>
<meta name="description" content="전문가 평가 60%와 팀 상호평가 40%로 최종 순위를 산출하는 캠프 평가 시스템">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="../app.css?v=8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body data-page="team">
<div class="hero short">
  <a class="home" href="../">← 처음으로</a>
  <button class="btn btn-g sm out hidden" id="btn-out">나가기</button>
  <div class="brand">MIRAE ASSET</div>
  <div class="hero-t">팀 상호평가</div>
  <div class="hero-s" id="hero-sub">디지털 자산 거래소 만들기</div>
</div>
<div class="wrap">
  <div class="card" id="entry">
    <div class="fhead"><span class="ic"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><b>팀 코드로 입장</b></div>
    <label class="lb">팀 코드 (책상 위 카드의 4자리)</label><input id="in-code" class="code" maxlength="4" inputmode="numeric" placeholder="0000" autocomplete="off">
    <p class="sub" id="peek" style="margin:-2px 0 10px;text-align:center"></p>
    <label class="lb">내 자리 번호</label><div class="seats" id="seats"><button type="button" class="seat" data-n="1">1번</button><button type="button" class="seat" data-n="2">2번</button><button type="button" class="seat" data-n="3">3번</button><button type="button" class="seat" data-n="4">4번</button><button type="button" class="seat" data-n="5">5번</button><button type="button" class="seat" data-n="6">6번</button></div>
    <button class="btn btn-p block" id="btn-in">입장하기</button>
  </div>
  <div id="main" class="hidden">
    <div class="card" style="padding:16px 22px"><span class="sub" id="who"></span></div>
    <div class="card waiting hidden" id="wait"><div class="big">⏳</div><h2 id="wait-t"></h2><p class="sub" id="wait-s"></p></div>
    <div id="body">
      <div class="myteam" id="myteam"></div>
      <div class="tabs" id="ptabs"></div>
      <div class="pc-desc" id="cdesc"></div>
      <div id="teams"></div>
      <div class="bar-fixed"><span id="rlabel">채점 <b class="remain" id="remain">0 / 0팀</b></span><div class="row"><button class="btn btn-s" id="btn-next">다음 기준</button><button class="btn btn-o" id="btn-save">평가 제출</button></div></div>
      <p class="tiny" id="saved" style="text-align:center;margin-top:10px"></p>
    </div>
  </div>
</div>
<div id="net-bar">서버에 연결할 수 없음 · 인터넷 연결을 확인해 주세요 (잠시 뒤 자동으로 다시 시도)</div>
<div class="toast" id="toast"></div>
<script src="../app.js?v=8"></script>
</body>
</html>
