<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IR Day 평가</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#0d1730;--card:#16233f;--line:#2a3a5e;--text:#eef2fb;--sub:#9fb0d0;--accent:#ff8a3d;--ok:#3ecf8e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;word-break:keep-all;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:28px 20px 60px}
.wrap.wide{max-width:860px}
header{margin-bottom:28px}
header small{color:var(--accent);font-weight:700;letter-spacing:.08em;font-size:13px}
header h1{font-size:28px;margin-top:4px}
h2{font-size:20px;margin-bottom:16px}
h3{font-size:17px;margin-bottom:12px}
p.sub{color:var(--sub);font-size:15px;margin:-8px 0 18px}
.btn{display:block;width:100%;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:18px;font-weight:700;text-align:left;cursor:pointer;margin-bottom:12px;text-decoration:none}
.btn:active{transform:scale(.99)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#1a1205;text-align:center}
.btn.main:disabled{opacity:.35;cursor:default}
.btn.sm{padding:12px 14px;font-size:15px;text-align:center}
.btn.done{opacity:.55}
.btn .r{float:right;font-weight:600;color:var(--sub);font-size:15px}
.btn.done .r{color:var(--ok)}
.link{background:none;border:0;color:var(--sub);font:inherit;font-size:15px;cursor:pointer;padding:8px 0;margin-bottom:12px}
input,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0a1226;color:var(--text);font:inherit;font-size:17px;margin-bottom:14px}
textarea{min-height:110px;resize:vertical}
input.code{font-size:36px;font-weight:800;text-align:center;letter-spacing:.4em;padding:18px}
.err{color:#ff9b9b;min-height:22px;font-size:15px;margin-bottom:8px}
.found{font-size:20px;font-weight:800;margin:4px 0 12px}
.seats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seats button{padding:20px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:22px;font-weight:800;cursor:pointer}
.seats button:active{background:var(--accent);color:#1a1205}
.me{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:14px;color:var(--sub);margin-bottom:14px}
.crit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.crit b{font-size:17px}
.crit span{display:block;color:var(--sub);font-size:14px;margin:2px 0 12px}
.pts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pts button{padding:12px 0;border-radius:10px;border:1px solid var(--line);background:#0a1226;color:var(--text);font:inherit;font-size:18px;font-weight:700;cursor:pointer}
.pts button.on{background:var(--accent);border-color:var(--accent);color:#1a1205}
.scale{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;margin-top:6px}
.team-big{font-size:26px;font-weight:800;margin-bottom:4px}
.msg{text-align:center;padding:40px 0}
.msg .ico{font-size:52px;margin-bottom:12px}
.msg p{color:var(--sub);margin:8px 0 24px}
.warn{background:#3a1f1f;border:1px solid #7a3a3a;border-radius:12px;padding:16px;color:#ffd2d2;font-size:15px;line-height:1.6;margin-bottom:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.ctable{width:100%;border-collapse:collapse;font-size:16px}
.ctable th,.ctable td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
.ctable th{color:var(--sub);font-weight:600;font-size:14px}
.ctable td.c{font-size:22px;font-weight:800;letter-spacing:.12em;color:var(--accent)}
.qrrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr{background:#fff;padding:10px;border-radius:12px;width:180px;height:180px}
.out{font-size:12px;color:var(--sub);word-break:break-all;flex:1;min-width:200px}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3 label,.lbl{font-size:14px;color:var(--sub);display:block}
.row3 input,.lbl input{margin-top:6px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hide{display:none}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.val{color:var(--sub);font-size:15px;white-space:nowrap}
.val strong{color:var(--accent);font-size:24px}
.val input.num{width:64px;margin:0;padding:6px 4px;text-align:center;font-size:24px;font-weight:800;color:var(--accent);background:#0a1226;border:1px solid var(--line);border-radius:10px}
.val input.num:focus{outline:none;border-color:var(--accent)}
.val input.num.over{border-color:#ff6b6b;animation:shake .25s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.sl{display:flex;align-items:center;gap:10px}
.sl input[type=range]{flex:1;margin:0;padding:0;height:36px;accent-color:var(--accent);background:none;border:0}
.sl input.untouched{opacity:.35}
.pm{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#0a1226;color:var(--text);font:inherit;font-size:22px;font-weight:700;cursor:pointer}
.sum{text-align:right;color:var(--sub);margin:4px 0 12px;font-size:16px}
.sum strong{color:var(--text);font-size:22px}
.ktable td:nth-child(2){width:auto}.ktable td:nth-child(1){width:30%}.ktable td:nth-child(3){width:18%}
.ok{background:#123a2a;border:1px solid #2e7a55;border-radius:12px;padding:14px 16px;color:#c9f5df;font-size:15px;margin-bottom:12px}
.etable{width:100%;border-collapse:collapse}
.etable th{color:var(--sub);font-weight:600;font-size:13px;text-align:left;padding:0 6px 6px}
.etable td{padding:4px 6px;vertical-align:middle}
.etable input{margin:0;padding:10px;font-size:16px}
.etable input.cin{font-weight:800;letter-spacing:.12em;color:var(--accent)}
.etable td:nth-child(2),.etable td:nth-child(3){width:22%}
.etable td:nth-child(4){width:40px}
.etable .xrow td:first-child{color:var(--sub);font-weight:700;padding-left:12px}
.del{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;width:34px;height:34px;cursor:pointer}
.adm{position:fixed;right:14px;bottom:14px;background:var(--card);border:1px solid var(--line);color:var(--sub);font:inherit;font-size:13px;padding:8px 12px;border-radius:99px;cursor:pointer;opacity:.8}
.adm:hover{opacity:1}
body.admin .adm{display:none}
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  .wrap{display:none}
  #print{display:block;font-family:Pretendard,sans-serif}
  .pslips{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
  .pslip{border:1px dashed #888;padding:18px 10px;text-align:center;page-break-inside:avoid}
  .pslip .t{font-size:16px;font-weight:700}
  .pslip .c{font-size:30px;font-weight:800;letter-spacing:.15em;margin:6px 0}
  .pslip .s{font-size:16px}
  .pslip .h{font-size:11px;color:#555;margin-top:6px}
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header><small>IR DAY</small><h1>발표 평가</h1></header>
  <main id="app"></main>
</div>
<div id="print"></div>
<button class="adm" id="adm">🔧 관리자</button>

<script>
// 평가 항목 5개 (이름·설명·배점은 관리자 모드에서 수정 → 저장)
const DEFAULT_K=[
  {name:'문제 정의',desc:'거래 자산의 매력도 · 문제 정의',max:15},
  {name:'금융투자 반영',desc:'금융 원칙과 원리 반영',max:25},
  {name:'앱 완성도',desc:'핵심 기능이 모두 작동하는가',max:20},
  {name:'창의성 · 독창성',desc:'다른 팀과 구별되는 우리만의 색깔',max:20},
  {name:'발표력',desc:'전달력 · 시간 준수 · 팀워크',max:20}
];
const sumMax=k=>k.reduce((s,c)=>s+(+c.max||0),0);
const DEFAULT_PW='9802';
const $app=document.getElementById('app');
const $wrap=document.getElementById('wrap');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fnv(str){let h=2166136261;for(const c of str){h^=c.codePointAt(0);h=Math.imul(h,16777619)>>>0}return h}

// 설정은 링크 뒤(#)에 담김
// f=폼 키 · e=문항 번호 9개 · t=팀 이름 · n=팀별 자리 수 · c=팀 코드들+전문가 코드 · x=전문가 수 · r=결과 시트 ID · p=관리자 비밀번호(암호화)
function readCfg(hash){
  const h=new URLSearchParams(hash.replace(/^#/,''));
  const t=(h.get('t')||'').split(',').map(s=>s.trim()).filter(Boolean);
  const s=Math.min(9,+h.get('s')||4);
  const n=(h.get('n')||'').split(',').map(Number);
  const c={f:h.get('f')||'',e:(h.get('e')||'').split(',').filter(Boolean),t,
    n:t.map((_,i)=>Math.min(9,Math.max(1,n[i]||s))),
    x:h.has('x')?Math.min(9,Math.max(0,+h.get('x')||0)):4,
    c:(h.get('c')||'').split(',').filter(Boolean),r:h.get('r')||'',p:h.get('p')||'',k:JSON.parse(JSON.stringify(DEFAULT_K))};
  if(c.c.length!==c.t.length+1)c.c=autoCodes(c);
  return c;
}
// 기본 코드: 1팀 1000 · 2팀 2000 · … · 전문가 9800 (10팀부터는 겹치지 않는 4자리)
function autoCodes(c){
  const used=new Set([DEFAULT_PW,'9800']);
  const out=c.t.map((_,i)=>{let code=i<8?String((i+1)*1000):'';if(!code||used.has(code)){let n=0;do{code=String(1000+fnv(c.f+'|t'+i+'|'+n)%9000);n++}while(used.has(code))}used.add(code);return code});
  return [...out,'9800'];
}
function buildUrl(c){
  return location.origin+location.pathname+'#f='+c.f+'&e='+c.e.join(',')+'&t='+encodeURIComponent(c.t.join(','))
    +'&n='+c.n.join(',')+'&c='+c.c.join(',')+'&x='+c.x+(c.r?'&r='+c.r:'')+(c.p?'&p='+c.p:'');
}
const pwHash=v=>fnv('ir-pw|'+v).toString(36);
const pwOk=(v,c=cfg)=>c.p?pwHash(v)===c.p:v===DEFAULT_PW;
function groupCodes(c){
  const g=c.t.map((t,i)=>({code:c.c[i],role:'학생',name:t,seats:c.n[i]}));
  if(c.x>0)g.push({code:c.c[c.t.length],role:'전문가',name:'전문가',seats:c.x});
  return g;
}
const cfg=readCfg(location.hash);
const ready=cfg.f&&cfg.e.length===10&&cfg.t.length>0;
let GROUPS=ready?groupCodes(cfg):[];
const LINK=location.origin+location.pathname+location.hash;

// 저장된 설정: Firebase (invest-game 다른 앱과 같은 DB) → 링크·QR은 그대로, 설정만 바뀜
const FB='https://geang-invest-default-rtdb.firebaseio.com/classes/IR-'+encodeURIComponent(cfg.f)+'.json';
const KEYS=['t','n','c','x','r','p','k'];
function applyRemote(d){
  if(!d||!Array.isArray(d.t)||!d.t.length||!Array.isArray(d.c)||d.c.length!==d.t.length+1)return false;
  KEYS.forEach(k=>{if(d[k]!==undefined)cfg[k]=d[k]});
  if(!Array.isArray(cfg.n)||cfg.n.length!==cfg.t.length)cfg.n=cfg.t.map(()=>4);
  if(!Array.isArray(cfg.k)||cfg.k.length!==5)cfg.k=JSON.parse(JSON.stringify(DEFAULT_K));
  GROUPS=groupCodes(cfg);return true;
}
async function loadRemote(){
  if(!ready)return;
  try{const r=await fetch(FB,{cache:'no-store'});if(r.ok)applyRemote(await r.json())}catch(e){}
}
async function saveRemote(d){
  const body={};KEYS.forEach(k=>body[k]=d[k]);body.saved=new Date().toISOString();
  const r=await fetch(FB,{method:'PUT',body:JSON.stringify(body)});
  if(!r.ok)throw new Error('save');
}

const st={role:'',who:'',mine:'',team:'',score:{}};
const meKey='ir:me:'+cfg.f;
const doneKey=()=>'ir:'+cfg.f+':'+st.who;
const doneList=()=>{try{return JSON.parse(localStorage.getItem(doneKey())||'[]')}catch(e){return[]}};
const markDone=t=>{try{const d=doneList();if(!d.includes(t))d.push(t);localStorage.setItem(doneKey(),JSON.stringify(d))}catch(e){}};
const seatLabel=(g,n)=>g.role==='학생'?g.name+'-'+n:'전문가'+n;

// ── 입장: 팀 코드 → 자리 번호 ──
function home(){
  $wrap.classList.remove('wide');
  if(!ready){
    $app.innerHTML='<div class="warn">구글폼이 연결되지 않은 링크입니다.<br>운영진에게 받은 평가 링크(QR)로 다시 열어 주세요.</div>';
    return;
  }
  try{const me=JSON.parse(sessionStorage.getItem(meKey)||'null');if(me){Object.assign(st,me);return teamList()}}catch(e){}
  st.role=st.who=st.mine=st.team='';
  loadRemote();
  $app.innerHTML=`<h2>팀 코드</h2><p class="sub">테이블에 있는 코드 4자리를 입력해 주세요</p>
    <input id="code" class="code" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000">
    <p id="err" class="err"></p><div id="seat"></div>`;
  const inp=document.getElementById('code');inp.focus();
  let tmr=null;
  inp.oninput=()=>{
    inp.value=inp.value.replace(/\D/g,'');
    const v=inp.value,err=document.getElementById('err'),seat=document.getElementById('seat');
    err.textContent='';seat.innerHTML='';clearTimeout(tmr);
    if(v.length<4)return;
    const g=GROUPS.find(x=>x.code===v);
    if(!g){if(pwOk(v))return admin();err.textContent='없는 코드예요. 다시 확인해 주세요';inp.select();return}
    seat.innerHTML=`<div class="found">${g.role==='학생'?'🙋':'🏅'} ${esc(g.name)}</div>
      <p class="sub" style="margin:0 0 12px">${g.role==='학생'?'내 자리 번호를 눌러 주세요':'내 번호를 눌러 주세요'}</p>
      <div class="seats">${Array.from({length:g.seats},(_,i)=>`<button data-n="${i+1}">${i+1}</button>`).join('')}</div>`;
    seat.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{
      const me={role:g.role,who:seatLabel(g,b.dataset.n),mine:g.role==='학생'?g.name:''};
      Object.assign(st,me);
      try{sessionStorage.setItem(meKey,JSON.stringify(me))}catch(e){}
      teamList();
    });
  };
}
function logout(){try{sessionStorage.removeItem(meKey)}catch(e){}home()}

function teamList(){
  const done=doneList();
  const teams=cfg.t.filter(t=>t!==st.mine);
  const left=teams.filter(t=>!done.includes(t)).length;
  $app.innerHTML=`<div class="me">${st.role==='학생'?'🙋':'🏅'} ${esc(st.who)}</div>
    <h2>평가할 팀</h2><p class="sub">${left?`남은 팀 ${left}개`:'모든 팀 평가 완료! 감사합니다 👏'}</p>
    ${teams.map(t=>{const d=done.includes(t);return `<button class="btn ${d?'done':''}" data-t="${esc(t)}">${esc(t)}<span class="r">${d?'✓ 완료':'평가하기'}</span></button>`}).join('')}
    <button class="link" id="back">나가기</button>`;
  $app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('done')&&!confirm('이미 평가한 팀입니다. 다시 평가할까요?'))return;
    st.team=b.dataset.t;st.score={};scoreForm();
  });
  document.getElementById('back').onclick=logout;
}

function scoreForm(){
  const K=cfg.k,total=sumMax(K);
  $app.innerHTML=`<div class="team-big">${esc(st.team)}</div><p class="sub" style="margin:0 0 18px">항목마다 점수를 정해 주세요 · 총 ${total}점</p>
    ${K.map((c,i)=>`<div class="crit" data-c="${i}">
      <div class="chead"><b>${esc(c.name)}</b><div class="val"><input id="v${i}" data-i="${i}" class="num" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="–" autocomplete="off"> / ${c.max}점</div></div>
      <span>${esc(c.desc)}</span>
      <div class="sl"><button class="pm" data-pm="-1" data-i="${i}">−</button>
        <input type="range" min="0" max="${c.max}" step="1" value="${Math.round(c.max/2)}" data-i="${i}" class="untouched">
        <button class="pm" data-pm="1" data-i="${i}">+</button></div>
      <div class="scale"><em style="font-style:normal">0</em><em style="font-style:normal">${c.max}</em></div></div>`).join('')}
    <div class="sum">합계 <strong id="tot">0</strong> / ${total}점</div>
    <textarea id="note" placeholder="${st.role==='학생'?'칭찬 한 줄 (선택)':'한마디 (선택)'}"></textarea>
    <button class="btn main" id="send" disabled>제출하기 (0/5)</button>
    <button class="link" id="back">← 팀 목록</button>`;
  const send=document.getElementById('send');
  const refresh=()=>{
    const n=Object.keys(st.score).length;
    document.getElementById('tot').textContent=Object.values(st.score).reduce((a,b)=>a+b,0);
    send.disabled=n<5;send.textContent=n<5?`제출하기 (${n}/5)`:'제출하기';
  };
  const set=(i,v,typed)=>{
    const c=K[i];v=Math.max(0,Math.min(c.max,Math.round(v)));st.score[i]=v;
    const r=$app.querySelector(`input[type=range][data-i="${i}"]`);r.value=v;r.classList.remove('untouched');
    const box=document.getElementById('v'+i);if(!typed||+box.value!==v)box.value=v;box.dataset.prev=String(v);
    refresh();
  };
  $app.querySelectorAll('input[type=range]').forEach(r=>r.oninput=()=>set(+r.dataset.i,+r.value));
  $app.querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;const cur=st.score[i]??Math.round(K[i].max/2);set(i,st.score[i]===undefined?cur:cur+(+b.dataset.pm))});
  // 숫자 직접 입력: 정수만 (소수점·음수 불가), 배점을 넘으면 배점으로 맞춤
  $app.querySelectorAll('input.num').forEach(box=>{
    const i=+box.dataset.i;
    box.onkeydown=e=>{if(['.',',','e','E','-','+'].includes(e.key))e.preventDefault()};
    box.oninput=()=>{
      const v=box.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'');
      if(v!==box.value)box.value=v;
      if(v===''){delete st.score[i];box.dataset.prev='';$app.querySelector(`input[type=range][data-i="${i}"]`).classList.add('untouched');return refresh()}
      if(+v>K[i].max){box.value=box.dataset.prev||'';box.classList.add('over');box.title='최대 '+K[i].max+'점';setTimeout(()=>box.classList.remove('over'),700);return}
      box.dataset.prev=v;set(i,+v,true);
    };
    box.onfocus=()=>box.select();
  });
  send.onclick=submit;
  document.getElementById('back').onclick=teamList;
}

async function submit(){
  const send=document.getElementById('send');
  send.disabled=true;send.textContent='보내는 중…';
  const K=cfg.k,total=K.reduce((s,_,i)=>s+st.score[i],0);
  const v=[st.role,st.who,st.team,...K.map((_,i)=>st.score[i]),total,document.getElementById('note').value.trim()];
  const body=new URLSearchParams();
  cfg.e.forEach((id,i)=>body.append('entry.'+id,v[i]));
  try{
    await fetch(`https://docs.google.com/forms/d/e/${cfg.f}/formResponse`,{method:'POST',mode:'no-cors',body});
    markDone(st.team);
    $app.innerHTML=`<div class="msg"><div class="ico">✅</div><h2>${esc(st.team)} 평가 완료</h2><p>${total}점 / ${sumMax(K)}점</p>
      <button class="btn main" id="next">다음 팀 평가</button></div>`;
    document.getElementById('next').onclick=teamList;
  }catch(e){
    send.disabled=false;send.textContent='전송 실패 · 다시 누르기';
    alert('인터넷 연결을 확인하고 다시 눌러 주세요.');
  }
}

// ── 관리자 모드 ──
let draft=null;
let saved=false;
function admin(view=cfg){
  document.body.classList.add('admin');
  $wrap.classList.add('wide');
  const groups=groupCodes(view);
  const url=LINK;
  draft=JSON.parse(JSON.stringify(view));
  $app.innerHTML=`<div class="me">🔧 관리자 모드</div>
    ${saved?'<div class="ok">✓ 저장됐어요. 링크·QR은 그대로이고, 모든 기기에 새 설정이 적용됩니다.</div>':''}
    <div class="panel"><h3>코드표</h3>
      <table class="ctable"><tr><th>구분</th><th>코드</th><th>자리 번호</th><th>기록되는 이름</th></tr>
      ${groups.map(g=>`<tr><td>${esc(g.name)}</td><td class="c">${g.code}</td><td>1~${g.seats}</td><td>${esc(seatLabel(g,1))} ~ ${esc(seatLabel(g,g.seats))}</td></tr>`).join('')}</table>
      <div class="btns" style="margin-top:14px"><button class="btn sm" id="pr">자리별 코드 카드 인쇄</button><button class="btn sm" id="cp">평가 링크 복사</button></div>
    </div>
    <div class="panel"><h3>평가 항목</h3><p class="sub" style="margin:0">${view.k.map(c=>esc(c.name)+' '+c.max).join(' · ')} = ${sumMax(view.k)}점</p></div>
    <div class="panel"><h3>평가 링크 · QR</h3>
      <div class="qrrow"><img class="qr" alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=0&data=${encodeURIComponent(url)}"><div class="out">${esc(url)}</div></div>
      <p class="sub" style="margin:10px 0 0">설정을 바꿔도 이 링크·QR은 바뀌지 않아요</p>
    </div>
    <div class="panel"><h3>결과</h3>
      ${view.r?`<a class="btn sm" href="https://docs.google.com/spreadsheets/d/${esc(view.r)}/edit" target="_blank" rel="noopener">결과 시트 열기 (팀별 점수·순위)</a>`:'<p class="sub" style="margin:0 0 8px">결과 시트 주소를 아래 설정에 넣으면 여기서 바로 열 수 있어요</p>'}
      <p class="sub" style="margin:4px 0 0">평가 마감은 구글폼에서 '응답 받기'를 끄면 됩니다</p>
    </div>
    <div class="panel"><h3>설정 수정</h3><div id="setbox"></div></div>
    <button class="link" id="out">관리자 모드 나가기</button>`;
  renderSettings();
  document.getElementById('out').onclick=()=>{document.body.classList.remove('admin');(back||home)()};
  document.getElementById('cp').onclick=e=>navigator.clipboard.writeText(url).then(()=>e.target.textContent='복사됨 ✓');
  document.getElementById('pr').onclick=()=>{printSlips(groups);window.print()};
  saved=false;
}

function renderSettings(){
  const d=draft,T=d.t.length;
  document.getElementById('setbox').innerHTML=`
    <table class="etable"><tr><th>팀 이름</th><th>팀 코드</th><th>자리 수</th><th></th></tr>
    ${d.t.map((t,i)=>`<tr>
      <td><input data-k="t" data-i="${i}" value="${esc(t)}"></td>
      <td><input data-k="c" data-i="${i}" value="${esc(d.c[i])}" inputmode="numeric" maxlength="4" class="cin"></td>
      <td><input data-k="n" data-i="${i}" value="${d.n[i]}" type="number" min="1" max="9"></td>
      <td>${T>1?`<button class="del" data-del="${i}" title="팀 삭제">✕</button>`:''}</td></tr>`).join('')}
    <tr class="xrow"><td>전문가</td>
      <td><input data-k="xc" value="${esc(d.c[T])}" inputmode="numeric" maxlength="4" class="cin"></td>
      <td><input data-k="x" value="${d.x}" type="number" min="0" max="9"></td><td></td></tr>
    </table>
    <button class="btn sm" id="addt" style="margin:10px 0 16px">+ 팀 추가</button>
    <table class="etable ktable"><tr><th>평가 항목</th><th>설명</th><th>배점</th></tr>
    ${d.k.map((c,i)=>`<tr><td><input data-k="kn" data-i="${i}" value="${esc(c.name)}"></td><td><input data-k="kd" data-i="${i}" value="${esc(c.desc)}"></td><td><input data-k="km" data-i="${i}" type="number" min="1" max="100" value="${c.max}"></td></tr>`).join('')}
    </table>
    <p class="sub" style="margin:6px 0 16px">배점 합계 <b id="ksum">${sumMax(d.k)}</b>점</p>
    <div class="row3">
      <label>관리자 비밀번호 바꾸기<input id="npw" inputmode="numeric" maxlength="4" placeholder="숫자 4자리 (비우면 그대로)"></label>
      <label>결과 시트 주소<input id="rs" placeholder="https://docs.google.com/spreadsheets/d/…" value="${d.r?'https://docs.google.com/spreadsheets/d/'+esc(d.r)+'/edit':''}"></label>
    </div>
    <p id="serr" class="err"></p>
    <button class="btn main" id="apply">저장하기</button>
    <p class="sub" style="margin:4px 0 0">팀 코드 4자리 · 자리 수 1~9 · 전문가 수 0이면 전문가 평가 없음</p>`;
  const box=document.getElementById('setbox');
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{collect();const i=+b.dataset.del;draft.t.splice(i,1);draft.n.splice(i,1);draft.c.splice(i,1);renderSettings()});
  document.getElementById('addt').onclick=()=>{
    collect();const used=new Set(draft.c);let code=String((draft.t.length+1)*1000);if(draft.t.length>=8||used.has(code)||pwOk(code,draft)){do{code=String(1000+Math.floor(Math.random()*9000))}while(used.has(code)||pwOk(code,draft))}
    draft.t.push((draft.t.length+1)+'팀');draft.n.push(draft.n[draft.n.length-1]||4);draft.c.splice(draft.t.length-1,0,code);renderSettings();
  };
  document.getElementById('apply').onclick=apply;
  box.querySelectorAll('[data-k="km"]').forEach(el=>el.oninput=()=>{document.getElementById('ksum').textContent=[...box.querySelectorAll('[data-k="km"]')].reduce((s,x)=>s+(+x.value||0),0)});
}
function collect(){
  const box=document.getElementById('setbox'),d=draft,T=d.t.length;
  box.querySelectorAll('[data-k]').forEach(el=>{
    const k=el.dataset.k,i=+el.dataset.i,v=el.value.trim();
    if(k==='t')d.t[i]=v.replace(/[,|]/g,' ');
    if(k==='c')d.c[i]=v;
    if(k==='n')d.n[i]=+v;
    if(k==='xc')d.c[T]=v;
    if(k==='x')d.x=+v;
    if(k==='kn')d.k[i].name=v;
    if(k==='kd')d.k[i].desc=v;
    if(k==='km')d.k[i].max=+v;
  });
  const m=(document.getElementById('rs').value||'').match(/\/d\/([\w-]{20,})/);
  d.r=m?m[1]:'';
}
async function apply(){
  collect();
  const d=draft,err=document.getElementById('serr'),T=d.t.length;
  const fail=m=>{err.textContent=m;return false};
  if(d.t.some(t=>!t))return fail('비어 있는 팀 이름이 있어요');
  if(new Set(d.t).size!==T)return fail('같은 팀 이름이 두 번 있어요');
  if(d.c.some(c=>!/^\d{4}$/.test(c)))return fail('코드는 숫자 4자리로 넣어 주세요');
  if(new Set(d.c).size!==d.c.length)return fail('같은 코드가 두 번 있어요');
  if(d.n.some(n=>!(n>=1&&n<=9)))return fail('자리 수는 1~9로 넣어 주세요');
  if(!(d.x>=0&&d.x<=9))return fail('전문가 수는 0~9로 넣어 주세요');
  if(d.k.some(c=>!c.name))return fail('비어 있는 평가 항목 이름이 있어요');
  if(d.k.some(c=>!(Number.isInteger(c.max)&&c.max>=1&&c.max<=100)))return fail('배점은 1~100 사이 정수로 넣어 주세요');
  if(sumMax(d.k)>100)return fail('배점 합계가 100점을 넘어요');
  const np=document.getElementById('npw').value.trim();
  if(np){if(!/^\d{4}$/.test(np))return fail('비밀번호는 숫자 4자리로 넣어 주세요');d.p=pwHash(np)}
  if(d.c.some(c=>pwOk(c,d)))return fail('관리자 비밀번호와 같은 코드는 쓸 수 없어요');
  const btn=document.getElementById('apply');btn.disabled=true;btn.textContent='저장하는 중…';
  try{await saveRemote(d)}catch(e){btn.disabled=false;btn.textContent='저장하기';return fail('저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요')}
  KEYS.forEach(k=>cfg[k]=JSON.parse(JSON.stringify(d[k]??'')));
  if(!d.p)cfg.p='';
  GROUPS=groupCodes(cfg);
  saved=true;admin(cfg);window.scrollTo(0,0);
}

let back=null;
function adminLogin(){
  if(!ready)return;
  back=st.who?teamList:home;
  $wrap.classList.remove('wide');
  $app.innerHTML=`<h2>관리자 모드</h2><p class="sub">관리자 비밀번호 4자리</p>
    <input id="apw" class="code" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
    <p id="aerr" class="err"></p>
    <button class="link" id="aback">← 돌아가기</button>`;
  const i=document.getElementById('apw');i.focus();
  i.oninput=()=>{i.value=i.value.replace(/\D/g,'');document.getElementById('aerr').textContent='';
    if(i.value.length<4)return;
    if(pwOk(i.value))admin();else{document.getElementById('aerr').textContent='비밀번호가 맞지 않아요';i.select()}};
  document.getElementById('aback').onclick=()=>(back||home)();
}
document.getElementById('adm').onclick=adminLogin;

function printSlips(groups){
  const slips=[];
  groups.forEach(g=>{for(let n=1;n<=g.seats;n++)slips.push(`<div class="pslip"><div class="t">${esc(g.name)}</div><div class="c">${g.code}</div><div class="s">${g.role==='학생'?'자리':'번호'} ${n}</div><div class="h">QR → 코드 입력 → 번호 ${n} 누르기</div></div>`)});
  document.getElementById('print').innerHTML=`<div class="pslips">${slips.join('')}</div>`;
}

(async()=>{if(ready){$app.innerHTML='<p class="sub">불러오는 중…</p>';await loadRemote()}home()})();
</script>
